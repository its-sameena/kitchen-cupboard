<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f2ee" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cupboard" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- Fonts: change these (and --font-body / --font-display in src/styles.css) to restyle the text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Kitchen Cupboard</title>
    <!-- Shown before the app's code loads; the Loading screen (src/components/Welcome.tsx) keeps the logo in the same spot. -->
    <style>
      html, body { margin: 0; background: #f3f2ee; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f3f2ee; }
      .boot-logo { width: 30vw; height: 30vw; display: block; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><img class="boot-logo" src="/favicon.svg" alt="" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
